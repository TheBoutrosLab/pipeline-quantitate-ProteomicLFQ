output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
project_name:
  type: String
  required: true
  help: Project name used in output paths.
algorithm:
  type: String
  required: true
  help: LFQ workflow, de novo or FFId.
mzML_csv:
  type: Path
  mode: r
  required: false
  help: mzML input table for FFId and de novo mzML entry point.
featureXML_csv:
  type: Path
  mode: r
  required: false
  help: featureXML input table for the de novo featureXML entry point.
idXML_csv:
  type: Path
  mode: r
  required: false
  help: Sample level idXML input table.
resource_allocation_profile_tag:
  type: String
  required: false
  help: Resource profile in resources.json.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource adjustments.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory adjustments.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU adjustments.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
enable_mbr:
  type: Bool
  required: false
  help: Enable QT match between runs in the FFId workflow.
mbr_seed_detector:
  type: String
  required: false
  help: Seed detector for FFId MBR; only multiplex is currently supported.
ffmultiplex_intensity_threshold:
  type: Number
  required: false
  help: Minimum MS1 peak intensity for untargeted seed detection.
ffmultiplex_min_charge:
  type: Integer
  required: false
  help: Minimum seed charge.
ffmultiplex_max_charge:
  type: Integer
  required: false
  help: Maximum seed charge.
