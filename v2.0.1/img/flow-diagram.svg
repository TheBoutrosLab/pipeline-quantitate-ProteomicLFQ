<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1810" viewBox="0 0 1500 1810" role="img" aria-labelledby="title description">
<title id="title">Quantitate Proteomic LFQ workflow</title>
<desc id="description">Three per-run feature routes feed either linked cohort quantification or independent sample quantification. Match between runs adds untargeted seeds before seeded FeatureFinderIdentification.</desc>
<defs><style>
.heading { font-family: Helvetica,Arial,sans-serif; font-size: 26px; font-weight: 700; fill: #173044; }
.title { font-family: Helvetica,Arial,sans-serif; font-size: 23px; font-weight: 700; fill: #173044; }
.body { font-family: Helvetica,Arial,sans-serif; font-size: 19px; fill: #173044; }
.small { font-family: Helvetica,Arial,sans-serif; font-size: 17px; fill: #526879; }
.edge { font-family: Helvetica,Arial,sans-serif; font-size: 16px; fill: #526879; }
.center { text-anchor: middle; }
.line { fill: none; stroke: #4b6172; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.dashed { stroke-dasharray: 8 6; }
.arrowhead { fill: #4b6172; }
.input { fill: #eff4f8; stroke: #9bb1c2; stroke-width: 2; }
.process { fill: #fff; stroke: #7398c7; stroke-width: 2; }
.mbr-process { fill: #fff; stroke: #70aa90; stroke-width: 2; }
.link-process { fill: #fff; stroke: #7398c7; stroke-width: 2; }
.independent-process { fill: #fff; stroke: #70aa90; stroke-width: 2; }
.output { fill: #fff8e8; stroke: #d2a956; stroke-width: 2; }
.note { fill: #f7f9fb; stroke: #d4dfe7; stroke-width: 1.5; }
.section { fill: #f3f7fb; stroke: #cbdbe9; stroke-width: 1.5; }
</style></defs>
<rect width="1500" height="1810" fill="#fff"/>

<g transform="translate(0 -80)">
