<text class="title center" x="750" y="142">Inputs</text>
<text class="body center" x="750" y="169">FFId: mzML.csv + idXML.csv    •    de novo: mzML.csv or featureXML.csv + idXML.csv</text>
<text class="small center" x="750" y="188">Each row carries sample_name and fraction_id; fractions are paired across samples</text>
