---
global:
  temp_dir: ./test/work
  nf_config: test/global.config
  remove_temp: false
  clean_logs: true

cases:
  - name: test-internal-only
    message: Integration test of FFId without match between runs
    nf_script: main.nf
    nf_config: test/test_internal_only/test.config
    skip: false
    verbose: true

  - name: test-unfractionated
    message: Integration test of OpenMS 3.6 peptide CSVs for two unfractionated samples
    nf_script: main.nf
    nf_config: test/test_unfractionated/test.config
    skip: false
    verbose: true

  - name: test-mbr-fractionated
    message: QT match between runs for two three-fraction samples
    nf_script: main.nf
    nf_config: test/test_mbr_fractionated/test.config
    skip: false
    verbose: true

  - name: test-mbr-unfractionated
    message: QT match between runs for two unfractionated samples
    nf_script: main.nf
    nf_config: test/test_mbr_unfractionated/test.config
    skip: false
    verbose: true

  - name: test-de-novo
    message: Test de novo pipeline
    nf_script: main.nf
    nf_config: test/test_de_novo/test.config
    skip: false
    verbose: true

  - name: test-de-novo-featureXML
    message: Test the de novo featureXML entrypoint with two three-fraction samples
    nf_script: main.nf
    nf_config: test/test_de_novo_featureXML/test.config
    skip: true
    verbose: true

  - name: test-quantify-peptides--no-peptide-quantified-from-valid-featureXML
    message: Test `quantify_peptides` process when no peptide can be quantified from a valid featureXML file.
    nf_script: test/test_quantify_peptides__no_peptide_quantified_from_valid_featureXML/test.nf
    nf_config: test/test_quantify_peptides__no_peptide_quantified_from_valid_featureXML/test.config
    verbose: true
